[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seriallens"
version = "0.3.0"
description = "AI 串口侦探 — 会看懂串口数据的调试助手 / Serial monitor that actually understands your bytes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SerialLens contributors" }]
keywords = ["serial", "uart", "assistant", "hardware", "embedded", "protocol", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pyserial>=3.5",
    "rich>=13.0",
    "httpx>=0.27",
    "mcp>=1.2; python_version>='3.10'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
seriallens = "seriallens.cli:main"

[project.urls]
Homepage = "https://github.com/wdfdsyhb/SerialLens"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

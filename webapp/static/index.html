<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SerialLens · AI 串口侦探</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <button class="new-chat" id="newChatBtn">＋ 新建任务</button>
    <div class="session-list" id="sessionList"></div>
    <div class="sidebar-foot">会话保存在本浏览器</div>
  </aside>
  <div class="sidebar-mask" id="sidebarMask"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="任务列表">☰</button>
      <div class="brand">
        <span class="brand-mark">SL</span>
        <span class="brand-name">SerialLens</span>
        <span class="brand-sub">AI 串口侦探 · 智能体</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
        <button class="icon-btn" id="settingsBtn" title="AI 设置">⚙</button>
        <span class="status-dot" id="statusDot" title="服务状态"></span>
      </div>
    </header>

  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-title">你好，我是 SerialLens</div>
      <div class="welcome-text">
        我让 AI Agent 也能「看懂」串口数据：乱码诊断、协议识别、协议学习并生成
        单片机可用的 C 解析器。当前为演示模式（内置虚拟传感器数据，无需硬件）。
        试试下面的快捷提问，或直接输入你的问题。
      </div>
    </div>
  </main>

  <div class="chips" id="chips">
    <button class="chip" data-q="演示一下串口乱码诊断">🔍 演示：乱码诊断</button>
    <button class="chip" data-q="演示协议识别分析">📡 演示：协议识别</button>
    <button class="chip" data-q="演示学习这个协议并生成 C 解析器">⚙️ 演示：学习协议 → 生成 C 代码</button>
    <button class="chip" data-q="帮我分析我上传的串口数据">📎 上传数据分析（先点左侧 📎 选文件）</button>
  </div>

  <footer class="composer">
    <div class="attach-bar" id="attachBar"></div>
    <div class="composer-row">
      <button class="icon-btn" id="attachBtn" title="上传数据文件（文本日志 / HEX / .bin / 图片）">📎</button>
      <textarea id="input" rows="1" placeholder="描述你的串口问题…" maxlength="500"></textarea>
      <button id="send" class="send" title="发送">发送</button>
    </div>
    <input type="file" id="fileInput" hidden multiple>
  </footer>
  </div>

  <div class="login-mask" id="loginMask">
    <div class="login-card">
      <span class="brand-mark login-mark">SL</span>
      <div class="login-title">SerialLens · AI 串口侦探</div>
      <div class="login-sub">请输入访问密码</div>
      <input type="password" id="loginInput" placeholder="访问密码" autocomplete="current-password">
      <button id="loginBtn" class="send login-btn">进入</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <div class="modal-mask" id="settingsModal" hidden>
    <div class="modal">
      <div class="modal-title">AI 设置 <span class="modal-badge" id="llmBadge">未配置</span></div>
      <div class="modal-hint">
        未配置时回复为内置模板；配置后由大模型生成真实对话（OpenAI 兼容接口，
        如 DeepSeek）。密钥仅存于服务内存，不落盘。
      </div>
      <label class="field">
        <span>API Base URL</span>
        <input id="cfgBase" placeholder="https://api.deepseek.com" autocomplete="off">
      </label>
      <label class="field">
        <span>API Key</span>
        <input id="cfgKey" type="password" placeholder="sk-..." autocomplete="off">
      </label>
      <label class="field">
        <span>模型名</span>
        <input id="cfgModel" placeholder="deepseek-chat" autocomplete="off">
      </label>
      <div class="field access-row">
        <span>访问密码（提交评审用）</span>
        <code id="cfgPw">—</code>
      </div>
      <div class="modal-actions">
        <button class="ghost-btn" id="cfgClose">取消</button>
        <button class="send" id="cfgSave">保存</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
